name: Test Extension

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main', 'master']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and bundle
        run: npm run build

      - name: Engine unit tests
        run: npm test

      - name: CLI smoke test
        run: node dist/cli.js test/unit --max-kb 2048

      - name: Package
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: npx vsce package --no-dependencies

      - name: Upload .vsix
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
