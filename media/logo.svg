<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3b6e"/>
      <stop offset="1" stop-color="#0d1430"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ed0ff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22a252"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d98c14"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e03e4e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- faint grid lines hint at a chart -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="176" x2="512" y2="176"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="336" x2="512" y2="336"/>
  </g>

  <!-- shield -->
  <path d="M256 70 L404 118 V252 C404 338 342 404 256 446 C170 404 108 338 108 252 V118 Z"
        fill="url(#shield)" stroke="url(#rim)" stroke-width="16" stroke-linejoin="round"/>

  <!-- grade bars -->
  <g filter="url(#glow)">
    <rect x="166" y="286" width="48" height="90" rx="10" fill="url(#green)"/>
    <rect x="232" y="230" width="48" height="146" rx="10" fill="url(#amber)"/>
    <rect x="298" y="162" width="48" height="214" rx="10" fill="url(#red)"/>
  </g>
  <!-- baseline -->
  <rect x="172" y="386" width="168" height="8" rx="4" fill="#ffffff" fill-opacity="0.35"/>
</svg>
